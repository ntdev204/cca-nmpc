# Standard local test configuration.
#
# Without this, package tests fail with ModuleNotFoundError unless PYTHONPATH is
# set by hand, and different contributors get contradictory pass/fail results
# (P2: test/CI command not standardized). `pythonpath` (pytest >= 7) puts every
# ament_python package source root and the repo root on sys.path so the whole
# suite runs with a single command:
#
#     python -m pytest
#
# Each ROS package lives at src/<pkg>/<pkg>/, so its import root is src/<pkg>.
# The repo root (".") is needed for the `tools.*` imports used by the dataset
# and training suites.
[pytest]
pythonpath =
    .
    src/cca_nmpc_msgs
    src/cca_nmpc_adaptive_params
    src/cca_nmpc_context
    src/cca_nmpc_prediction
    src/cca_nmpc_perception
    src/cca_nmpc_control

testpaths =
    tools/lstm_dataset/tests
    tools/lstm_training/tests
    tools/integration_harness/tests
    tools/context_calibration/tests
    src/cca_nmpc_adaptive_params/test
    src/cca_nmpc_context/test
    src/cca_nmpc_prediction/test
    src/cca_nmpc_perception/test
    src/cca_nmpc_control/test
    src/cca_nmpc_control/cca_nmpc_control/nmpc_solver/tests

# Quiet, dot-progress output by default.
addopts = -q
